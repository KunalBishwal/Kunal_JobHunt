name: daily job digest

on:
  schedule:
    # 12:00 PM (noon) IST -> 06:30 UTC every day
    - cron: "30 6 * * *"
    # 08:00 PM IST -> 14:30 UTC every day
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip the email, just build the digest artifact"
        type: boolean
        default: false


# Two runs sharing one dedupe store would race. Queue them instead.
concurrency:
  group: jobhunt-daily
  cancel-in-progress: false

permissions:
  contents: read         # nothing is pushed back; the store lives in the cache

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Restore the dedupe store
        # seen.json is what stops you being emailed the same job twice, so it
        # has to survive between runs. It is NOT committed: it is personal, and
        # a seen.json in the repo would mark every job as seen for anyone who
        # clones it. Cache entries are immutable, so the key is unique per run
        # and restore-keys pulls the most recent one forward.
        uses: actions/cache@v4
        with:
          path: seen.json
          key: jobhunt-seen-${{ github.run_id }}
          restore-keys: |
            jobhunt-seen-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify profile.json
        run: |
          python -c "import json; json.load(open('profile.json', encoding='utf-8')); print('profile.json loaded successfully')"


      - name: Run the pipeline
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          SCREEN_PROVIDER: ${{ vars.SCREEN_PROVIDER }}
          DRAFT_PROVIDER: ${{ vars.DRAFT_PROVIDER }}
          SCREEN_MODEL: ${{ vars.SCREEN_MODEL || 'gemini-3.6-flash' }}
          DRAFT_MODEL: ${{ vars.DRAFT_MODEL || 'gemini-3.6-flash' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m jobhunt run
          else
            python -m jobhunt run --send
          fi

      - name: Upload digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore

      - name: Report the dedupe store
        if: always()
        run: |
          if [ -f seen.json ]; then
            python -c "import json;print(f'tracking {len(json.load(open(\"seen.json\")))} postings')"
          else
            echo "no seen.json — first run, or the cache expired"
          fi
